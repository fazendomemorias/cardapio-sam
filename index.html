<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Cardápio da Sam</title>  
  
<style>html,body,#root{margin:0;min-height:100%}body{background:#1b1630}.sam{--paper: #f6ead0;--navy: #0c185c;--rust: #8a2a17;--gold: #b97d1b;--ink: #1d1712;min-height:100svh;display:flex;flex-direction:column;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,#2c2557,#151030 70%);font-family:Georgia,Times New Roman,serif}.top{display:flex;align-items:center;gap:10px;padding:56px 16px 8px;color:#f6ead0}.top-logo{width:34px;height:34px;filter:brightness(0) invert(.93) sepia(.3)}.top strong{display:block;font-size:1.15rem;line-height:1}.top small{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#d9b774;font-family:system-ui,sans-serif}.count{margin-left:auto;font:600 .8rem system-ui,sans-serif;color:#d9b774}.stage{flex:1;perspective:1400px;display:flex;align-items:center;justify-content:center;padding:6px 14px 10px;touch-action:pan-y}.book{position:relative;width:min(100%,460px);height:min(calc(100svh - 236px),720px);min-height:440px;transform-style:preserve-3d;transition:transform .25s ease-out}.sheet{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--paper);border-radius:4px 12px 12px 4px;transform-origin:left center;transition:transform .85s cubic-bezier(.5,.05,.2,1),opacity .35s ease .55s;backface-visibility:hidden;box-shadow:0 24px 40px -14px #000a,inset 8px 0 14px -8px #0004,inset -1px 0 #fff6}.sheet:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,#0003,transparent);border-radius:4px 0 0 4px;z-index:3}.frame{position:absolute;top:9px;right:9px;bottom:9px;left:9px;border:1px solid #8a2a1788;outline:1px solid #8a2a1744;outline-offset:-5px;border-radius:3px;display:flex}.scroll{flex:1;overflow-y:auto;padding:22px 18px 26px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{width:3px}.scroll::-webkit-scrollbar-thumb{background:#8a2a1766}h2{margin:4px 0 2px;text-align:center;font-weight:400;font-size:1.7rem}.sub{margin:0 0 4px;text-al
